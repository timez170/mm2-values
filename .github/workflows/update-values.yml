name: Sync values from Supreme
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Supreme -> values.json (abort-safe)
        run: python3 scrape_supreme.py
      - name: Append snapshot to history.json
        run: python3 update_history.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.json history.json
          git diff --cached --quiet || git commit -m "values: Supreme sync $(date -u '+%F %H:%M')"
          git push
